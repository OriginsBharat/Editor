<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Pratyaharthi</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Project Pratyaharthi</h1>
        <div class="card">
            <h2>Configuration</h2>
            <input type="password" id="apiKeyInput" placeholder="Enter your Groq API Key">
            <button id="saveApiKey">Save Key</button>
        </div>
        <div class="card">
            <h2>Upload Video</h2>
            <input type="file" id="videoUpload" accept="video/*">
        </div>
        <div class="card">
            <h2>Enter Command</h2>
            <input type="text" id="commandInput" placeholder="e.g., 'Remove Chinese text from the video'">
            <button id="executeCommand">Execute</button>
        </div>
        <div class="card">
            <h2>Logs</h2>
            <pre id="logContainer">Status updates will appear here...</pre>
        </div>
        <div class="card">
            <h2>Result</h2>
            <video id="videoPlayer" controls></video>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
